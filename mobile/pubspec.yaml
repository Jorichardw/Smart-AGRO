name: agro_bot_mobile
description: AGRO-BOT & AUTOMATION - Smart Agriculture Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3
  
  # HTTP & Networking
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  animations: ^2.0.8
  
  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.5
  image_cropper: ^5.0.1
  permission_handler: ^11.1.0
  
  # Location & Maps
  geolocator: ^10.1.0
  location: ^5.0.3
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0
  
  # Device Features
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.2
  battery_plus: ^4.0.2
  
  # Voice & Audio
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  audio_waveforms: ^1.0.5
  
  # Charts & Graphs
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^23.2.7
  
  # Date & Time
  intl: ^0.19.0
  timeago: ^3.6.0
  
  # Utils
  logger: ^2.0.2+1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # WebSocket
  socket_io_client: ^2.0.3+1
  
  # PDF & Documents
  pdf: ^3.10.7
  open_file: ^3.3.2
  
  # Biometric Authentication
  local_auth: ^2.1.7
  
  # Network Image
  extended_image: ^8.2.0
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0
  
  # Loading Indicators
  flutter_spinkit: ^5.2.0
  
  # Form Validation
  reactive_forms: ^17.0.1
  
  # HTTP Interceptor
  dio_certificate_pinning: ^4.1.0
  
  # Security
  crypto: ^3.0.3
  
  # Animations
  rive: ^0.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # Linting & Code Quality
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0
  
  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Testing
  mocktail: ^1.0.2
  integration_test:
    sdk: flutter
  
  # Assets
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

# Asset Configuration
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#22c55e"
    theme_color: "#22c55e"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

# Splash Screen Configuration  
flutter_native_splash:
  color: "#22c55e"
  image: assets/images/splash_logo.png
  color_dark: "#1a1a1a"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    image: assets/images/splash_logo_android12.png
    icon_background_color: "#22c55e"
    image_dark: assets/images/splash_logo_android12_dark.png
    icon_background_color_dark: "#1a1a1a"
  web: false